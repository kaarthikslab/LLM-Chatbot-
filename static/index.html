<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gemini Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>✨ Gemini Chat</h1>
      <button id="reset-btn" title="Start a new chat">New chat</button>
    </header>

    <section id="messages" class="messages">
      <div class="msg bot">Hi! Ask me anything, request content, translations, or code.</div>
    </section>

    <form id="chat-form">
      <textarea id="input" rows="1" placeholder="Type a message…" required></textarea>
      <button type="submit" id="send-btn">Send</button>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
